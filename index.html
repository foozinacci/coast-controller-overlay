<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coast Controller Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay-container">
        <!-- Left Hand: Xbox Elite 2 Controller (Left Side + Back Paddles) -->
        <div class="controller-section">
            <svg class="controller-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Controller Body - Left Half with integrated back paddle display -->
                <defs>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- Main Controller Body -->
                <path id="controller-body" class="body" filter="url(#shadow)" d="
                    M 200 50
                    C 160 50, 120 60, 100 80
                    L 60 120
                    C 40 140, 30 160, 30 180
                    L 30 220
                    C 30 250, 50 270, 80 270
                    L 120 270
                    C 140 270, 155 255, 160 240
                    L 170 200
                    C 175 185, 185 180, 200 180
                    L 200 180
                    C 215 180, 225 185, 230 200
                    L 240 240
                    C 245 255, 260 270, 280 270
                    L 320 270
                    C 350 270, 370 250, 370 220
                    L 370 180
                    C 370 160, 360 140, 340 120
                    L 300 80
                    C 280 60, 240 50, 200 50
                    Z
                "/>

                <!-- LT - Left Trigger -->
                <path id="lt" class="button" d="
                    M 85 45
                    C 95 40, 130 35, 145 40
                    L 150 55
                    C 140 60, 100 60, 85 55
                    Z
                "/>
                <text x="117" y="52" class="button-label">LT</text>

                <!-- LB - Left Bumper -->
                <path id="lb" class="button" d="
                    M 90 62
                    C 100 58, 135 55, 150 58
                    L 152 72
                    C 140 75, 105 75, 92 72
                    Z
                "/>
                <text x="121" y="69" class="button-label">LB</text>

                <!-- Left Stick (LS) -->
                <circle id="ls-base" class="stick-base" cx="105" cy="145" r="32"/>
                <circle id="ls" class="button stick" cx="105" cy="145" r="24"/>
                <text x="105" y="150" class="button-label stick-label">LS</text>

                <!-- D-Pad -->
                <g id="dpad" transform="translate(105, 215)">
                    <!-- D-Pad Base -->
                    <rect class="dpad-base" x="-25" y="-25" width="50" height="50" rx="5"/>
                    <!-- D-Pad Up -->
                    <path id="dpad-up" class="button dpad-btn" d="M -8 -25 L 8 -25 L 8 -8 L -8 -8 Z"/>
                    <!-- D-Pad Down -->
                    <path id="dpad-down" class="button dpad-btn" d="M -8 8 L 8 8 L 8 25 L -8 25 Z"/>
                    <!-- D-Pad Left -->
                    <path id="dpad-left" class="button dpad-btn" d="M -25 -8 L -8 -8 L -8 8 L -25 8 Z"/>
                    <!-- D-Pad Right -->
                    <path id="dpad-right" class="button dpad-btn" d="M 8 -8 L 25 -8 L 25 8 L 8 8 Z"/>
                    <!-- D-Pad Center -->
                    <rect class="dpad-center" x="-8" y="-8" width="16" height="16"/>
                </g>

                <!-- Menu Buttons -->
                <circle id="view-btn" class="button menu-btn" cx="170" cy="105" r="8"/>
                <text x="170" y="122" class="button-label-small">VIEW</text>

                <circle id="menu-btn" class="button menu-btn" cx="230" cy="105" r="8"/>
                <text x="230" y="122" class="button-label-small">MENU</text>

                <!-- Xbox Button -->
                <circle id="xbox-btn" class="button xbox-btn" cx="200" cy="90" r="12"/>
                <text x="200" y="94" class="button-label xbox-label">X</text>

                <!-- Back Paddles Section (displayed on right side of visual) -->
                <!-- P1 - Upper Left Back -->
                <path id="p1" class="button paddle" d="
                    M 270 140
                    C 280 135, 310 135, 320 140
                    L 325 165
                    C 315 170, 285 170, 275 165
                    Z
                "/>
                <text x="297" y="157" class="button-label">P1</text>

                <!-- P2 - Upper Right Back -->
                <path id="p2" class="button paddle" d="
                    M 330 140
                    C 340 135, 365 135, 375 140
                    L 378 165
                    C 368 170, 345 170, 335 165
                    Z
                "/>
                <text x="354" y="157" class="button-label">P2</text>

                <!-- P3 - Lower Left Back -->
                <path id="p3" class="button paddle" d="
                    M 275 180
                    C 285 175, 310 175, 320 180
                    L 322 205
                    C 312 210, 288 210, 278 205
                    Z
                "/>
                <text x="298" y="197" class="button-label">P3</text>

                <!-- P4 - Lower Right Back -->
                <path id="p4" class="button paddle" d="
                    M 330 180
                    C 340 175, 362 175, 372 180
                    L 374 205
                    C 364 210, 345 210, 335 205
                    Z
                "/>
                <text x="352" y="197" class="button-label">P4</text>

                <!-- Visual separator for back paddles area -->
                <text x="320" y="128" class="section-label">BACK</text>
            </svg>
        </div>

        <!-- Right Hand: Logitech M650 L Mouse -->
        <div class="mouse-section">
            <svg class="mouse-svg" viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="mouse-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- Mouse Body -->
                <path id="mouse-body" class="body" filter="url(#mouse-shadow)" d="
                    M 100 20
                    C 140 20, 170 50, 170 90
                    L 170 250
                    C 170 290, 140 310, 100 310
                    C 60 310, 30 290, 30 250
                    L 30 90
                    C 30 50, 60 20, 100 20
                    Z
                "/>

                <!-- Left Click -->
                <path id="mouse-left" class="button mouse-btn" d="
                    M 45 25
                    C 55 22, 75 20, 95 20
                    L 95 120
                    L 45 120
                    L 45 50
                    C 45 35, 45 28, 45 25
                    Z
                "/>
                <text x="70" y="75" class="button-label">L</text>

                <!-- Right Click -->
                <path id="mouse-right" class="button mouse-btn" d="
                    M 155 25
                    C 145 22, 125 20, 105 20
                    L 105 120
                    L 155 120
                    L 155 50
                    C 155 35, 155 28, 155 25
                    Z
                "/>
                <text x="130" y="75" class="button-label">R</text>

                <!-- Scroll Wheel Area -->
                <rect id="scroll-bg" class="scroll-base" x="85" y="45" width="30" height="50" rx="10"/>

                <!-- Scroll Up Indicator -->
                <path id="scroll-up" class="button scroll-btn" d="
                    M 100 48
                    L 110 60
                    L 90 60
                    Z
                "/>

                <!-- Scroll Click (Middle) -->
                <ellipse id="mouse-middle" class="button scroll-click" cx="100" cy="70" rx="10" ry="8"/>
                <text x="100" y="73" class="button-label-tiny">M</text>

                <!-- Scroll Down Indicator -->
                <path id="scroll-down" class="button scroll-btn" d="
                    M 100 92
                    L 110 80
                    L 90 80
                    Z
                "/>

                <!-- Side Button 4 (Forward) -->
                <path id="mouse-4" class="button side-btn" d="
                    M 30 130
                    L 25 130
                    C 20 130, 18 135, 18 140
                    L 18 160
                    C 18 165, 20 170, 25 170
                    L 30 170
                    Z
                "/>
                <text x="10" y="155" class="button-label-small side-label">4</text>

                <!-- Side Button 5 (Back) -->
                <path id="mouse-5" class="button side-btn" d="
                    M 30 180
                    L 25 180
                    C 20 180, 18 185, 18 190
                    L 18 210
                    C 18 215, 20 220, 25 220
                    L 30 220
                    Z
                "/>
                <text x="10" y="205" class="button-label-small side-label">5</text>

                <!-- Sensor Indicator -->
                <ellipse id="sensor" class="sensor" cx="100" cy="280" rx="15" ry="8"/>
                <text x="100" y="298" class="button-label-small">SENSOR</text>
            </svg>
        </div>
    </div>

    <!-- Debug/Status Panel (can be hidden in OBS) -->
    <div id="status-panel" class="status-panel">
        <div id="gamepad-status">Gamepad: Not Connected</div>
        <div id="mouse-status">Mouse: Tracking</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
