<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coast Controller Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay-container">
        <!-- Left Hand: Xbox Elite 2 Controller (Left Side Front + Back Paddles on Right) -->
        <div class="controller-section">
            <svg class="controller-svg" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- Main Controller Body (Xbox style) -->
                <path id="controller-body" class="body" filter="url(#shadow)" d="
                    M 220 35
                    C 180 35, 140 45, 115 65
                    L 70 105
                    C 45 130, 35 155, 35 180
                    L 40 215
                    C 45 245, 70 265, 100 265
                    L 130 260
                    C 155 255, 170 235, 178 210
                    L 190 170
                    C 198 150, 210 145, 220 145
                    C 230 145, 242 150, 250 170
                    L 262 210
                    C 270 235, 285 255, 310 260
                    L 340 265
                    C 370 265, 395 245, 400 215
                    L 405 180
                    C 405 155, 395 130, 370 105
                    L 325 65
                    C 300 45, 260 35, 220 35
                    Z
                "/>

                <!-- Xbox Button (center top) -->
                <circle id="xbox-btn" class="button xbox-btn" cx="220" cy="75" r="14"/>
                <text x="220" y="80" class="button-label xbox-label">X</text>

                <!-- ========== LEFT SIDE (Front Face) ========== -->

                <!-- LB - Left Bumper -->
                <path id="lb" class="button" d="
                    M 105 52
                    C 118 47, 155 44, 172 48
                    L 175 62
                    C 160 66, 120 66, 107 62
                    Z
                "/>
                <text x="140" y="58" class="button-label">LB</text>

                <!-- LT - Left Trigger -->
                <path id="lt" class="button" d="
                    M 100 35
                    C 115 28, 160 26, 178 32
                    L 180 48
                    C 162 52, 118 52, 102 46
                    Z
                "/>
                <text x="140" y="42" class="button-label">LT</text>

                <!-- Left Stick (LS) -->
                <circle id="ls-base" class="stick-base" cx="125" cy="125" r="30"/>
                <circle id="ls" class="button stick" cx="125" cy="125" r="22"/>
                <text x="125" y="129" class="button-label stick-label">LS</text>

                <!-- D-Pad -->
                <g id="dpad" transform="translate(125, 200)">
                    <!-- D-Pad Base (checkered pattern like reference) -->
                    <rect class="dpad-base" x="-22" y="-22" width="44" height="44" rx="4"/>

                    <!-- D-Pad Up -->
                    <rect id="dpad-up" class="button dpad-btn" x="-8" y="-22" width="16" height="16" rx="2"/>
                    <!-- D-Pad Down -->
                    <rect id="dpad-down" class="button dpad-btn" x="-8" y="6" width="16" height="16" rx="2"/>
                    <!-- D-Pad Left -->
                    <rect id="dpad-left" class="button dpad-btn" x="-22" y="-8" width="16" height="16" rx="2"/>
                    <!-- D-Pad Right -->
                    <rect id="dpad-right" class="button dpad-btn" x="6" y="-8" width="16" height="16" rx="2"/>

                    <!-- D-Pad Center -->
                    <rect class="dpad-center" x="-8" y="-8" width="16" height="16" rx="2"/>
                </g>

                <!-- Menu Buttons (small dots near center) -->
                <circle id="view-btn" class="button menu-btn" cx="185" cy="105" r="6"/>
                <circle id="menu-btn" class="button menu-btn" cx="255" cy="105" r="6"/>

                <!-- ========== RIGHT SIDE (Back Paddles Display) ========== -->
                <!-- These represent the back of the left grip, shown on right side -->

                <!-- Upper Back Paddles Area -->
                <!-- P1 - Upper paddle (mapped to RB = Tactical) -->
                <path id="p1" class="button paddle" d="
                    M 275 115
                    C 285 110, 315 110, 325 115
                    L 328 145
                    C 318 152, 290 152, 280 145
                    Z
                "/>
                <text x="302" y="136" class="button-label">P1</text>

                <!-- P2 - Upper right paddle -->
                <path id="p2" class="button paddle" d="
                    M 335 115
                    C 345 110, 375 110, 385 115
                    L 388 145
                    C 378 152, 350 152, 340 145
                    Z
                "/>
                <text x="362" y="136" class="button-label">P2</text>

                <!-- Lower Back Paddles Area -->
                <!-- P3 - Lower paddle (mapped to B = Crouch) -->
                <path id="p3" class="button paddle" d="
                    M 280 165
                    C 290 158, 318 158, 328 165
                    L 330 200
                    C 320 208, 292 208, 282 200
                    Z
                "/>
                <text x="305" y="188" class="button-label">P3</text>

                <!-- P4 - Lower right paddle (mapped to Y = Weapon) -->
                <path id="p4" class="button paddle" d="
                    M 340 165
                    C 350 158, 378 158, 388 165
                    L 390 200
                    C 380 208, 352 208, 342 200
                    Z
                "/>
                <text x="365" y="188" class="button-label">P4</text>

                <!-- Labels for paddle section -->
                <text x="345" y="100" class="section-label">BACK PADDLES</text>
            </svg>
        </div>

        <!-- Right Hand: Logitech M650 L Mouse -->
        <div class="mouse-section">
            <svg class="mouse-svg" viewBox="0 0 180 280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="mouse-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- Mouse Body -->
                <path id="mouse-body" class="body" filter="url(#mouse-shadow)" d="
                    M 90 15
                    C 130 15, 155 45, 155 80
                    L 155 220
                    C 155 255, 130 275, 90 275
                    C 50 275, 25 255, 25 220
                    L 25 80
                    C 25 45, 50 15, 90 15
                    Z
                "/>

                <!-- Left Click -->
                <path id="mouse-left" class="button mouse-btn" d="
                    M 38 20
                    C 50 16, 70 15, 85 15
                    L 85 105
                    L 38 105
                    L 38 45
                    C 38 30, 38 23, 38 20
                    Z
                "/>
                <text x="62" y="65" class="button-label">L</text>

                <!-- Right Click -->
                <path id="mouse-right" class="button mouse-btn" d="
                    M 142 20
                    C 130 16, 110 15, 95 15
                    L 95 105
                    L 142 105
                    L 142 45
                    C 142 30, 142 23, 142 20
                    Z
                "/>
                <text x="118" y="65" class="button-label">R</text>

                <!-- Scroll Wheel Area -->
                <rect id="scroll-bg" class="scroll-base" x="77" y="40" width="26" height="45" rx="8"/>

                <!-- Scroll Up Indicator -->
                <path id="scroll-up" class="button scroll-btn" d="
                    M 90 43
                    L 99 54
                    L 81 54
                    Z
                "/>

                <!-- Scroll Click (Middle) -->
                <ellipse id="mouse-middle" class="button scroll-click" cx="90" cy="63" rx="9" ry="7"/>
                <text x="90" y="66" class="button-label-tiny">M</text>

                <!-- Scroll Down Indicator -->
                <path id="scroll-down" class="button scroll-btn" d="
                    M 90 82
                    L 99 71
                    L 81 71
                    Z
                "/>

                <!-- Side Button 4 (Melee) -->
                <path id="mouse-4" class="button side-btn" d="
                    M 25 120
                    L 18 120
                    C 12 120, 10 126, 10 132
                    L 10 158
                    C 10 164, 12 170, 18 170
                    L 25 170
                    Z
                "/>
                <text x="2" y="150" class="button-label-small side-label">4</text>

                <!-- Side Button 5 (Ultimate) -->
                <path id="mouse-5" class="button side-btn" d="
                    M 25 180
                    L 18 180
                    C 12 180, 10 186, 10 192
                    L 10 218
                    C 10 224, 12 230, 18 230
                    L 25 230
                    Z
                "/>
                <text x="2" y="210" class="button-label-small side-label">5</text>

                <!-- Sensor Indicator -->
                <ellipse id="sensor" class="sensor" cx="90" cy="252" rx="14" ry="7"/>
                <text x="90" y="268" class="button-label-small">AIM</text>
            </svg>
        </div>
    </div>

    <!-- Debug/Status Panel (can be hidden in OBS) -->
    <div id="status-panel" class="status-panel">
        <div id="gamepad-status">Gamepad: Not Connected</div>
        <div id="mouse-status">Mouse: Tracking</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
