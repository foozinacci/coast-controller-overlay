<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coast Controller Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay-container">
        <!-- Left Hand: Xbox Elite 2 Controller (Left Side Front + Back Paddles on Right) -->
        <div class="controller-section">
            <svg class="controller-svg" viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- Main Controller Body (Xbox style) -->
                <path id="controller-body" class="body" filter="url(#shadow)" d="
                    M 210 35
                    C 170 35, 130 45, 105 65
                    L 60 105
                    C 35 130, 25 155, 25 180
                    L 30 215
                    C 35 245, 60 265, 90 265
                    L 120 260
                    C 145 255, 160 235, 168 210
                    L 180 170
                    C 188 150, 200 145, 210 145
                    C 220 145, 232 150, 240 170
                    L 252 210
                    C 260 235, 275 255, 300 260
                    L 330 265
                    C 360 265, 385 245, 390 215
                    L 395 180
                    C 395 155, 385 130, 360 105
                    L 315 65
                    C 290 45, 250 35, 210 35
                    Z
                "/>

                <!-- Xbox Button (center top) -->
                <circle id="xbox-btn" class="button xbox-btn" cx="210" cy="75" r="14"/>
                <text x="210" y="80" class="button-label xbox-label">X</text>

                <!-- ========== LEFT SIDE (Front Face) ========== -->

                <!-- LT - Left Trigger (ADS) -->
                <path id="lt" class="button" d="
                    M 90 35
                    C 105 28, 150 26, 168 32
                    L 170 48
                    C 152 52, 108 52, 92 46
                    Z
                "/>
                <text x="130" y="42" class="button-label">ADS</text>

                <!-- LB - Left Bumper (Extra Character Action) -->
                <path id="lb" class="button" d="
                    M 95 52
                    C 108 47, 145 44, 162 48
                    L 165 62
                    C 150 66, 110 66, 97 62
                    Z
                "/>
                <text x="130" y="58" class="button-label">EXTRA</text>

                <!-- Left Stick (LS) - Move / Click = Jump -->
                <circle id="ls-base" class="stick-base" cx="115" cy="125" r="30"/>
                <circle id="ls" class="button stick" cx="115" cy="125" r="22"/>
                <text x="115" y="122" class="button-label stick-label">MOVE</text>
                <text x="115" y="133" class="button-label-tiny">(JUMP)</text>

                <!-- D-Pad -->
                <g id="dpad" transform="translate(115, 200)">
                    <!-- D-Pad Base -->
                    <rect class="dpad-base" x="-22" y="-22" width="44" height="44" rx="4"/>

                    <!-- D-Pad Up -->
                    <rect id="dpad-up" class="button dpad-btn" x="-8" y="-22" width="16" height="16" rx="2"/>
                    <!-- D-Pad Down -->
                    <rect id="dpad-down" class="button dpad-btn" x="-8" y="6" width="16" height="16" rx="2"/>
                    <!-- D-Pad Left -->
                    <rect id="dpad-left" class="button dpad-btn" x="-22" y="-8" width="16" height="16" rx="2"/>
                    <!-- D-Pad Right -->
                    <rect id="dpad-right" class="button dpad-btn" x="6" y="-8" width="16" height="16" rx="2"/>

                    <!-- D-Pad Center -->
                    <rect class="dpad-center" x="-8" y="-8" width="16" height="16" rx="2"/>
                </g>

                <!-- Menu Buttons (small dots near center) -->
                <circle id="view-btn" class="button menu-btn" cx="175" cy="105" r="6"/>
                <circle id="menu-btn" class="button menu-btn" cx="245" cy="105" r="6"/>

                <!-- ========== RIGHT SIDE (Back Paddles Display) ========== -->
                <!-- Only 2 paddles - the left-side ones reachable with left hand -->

                <text x="330" y="110" class="section-label">BACK</text>

                <!-- Upper Back Paddle (mapped to B = Crouch) -->
                <path id="p1" class="button paddle" d="
                    M 280 125
                    C 295 118, 345 118, 360 125
                    L 365 160
                    C 350 168, 300 168, 285 160
                    Z
                "/>
                <text x="322" y="147" class="button-label">CROUCH</text>

                <!-- Lower Back Paddle (mapped to RB = Tactical) -->
                <path id="p2" class="button paddle" d="
                    M 285 180
                    C 300 172, 350 172, 365 180
                    L 368 218
                    C 353 226, 303 226, 288 218
                    Z
                "/>
                <text x="326" y="204" class="button-label">TACTICAL</text>
            </svg>
        </div>

        <!-- Right Hand: Logitech M650 L Mouse -->
        <div class="mouse-section">
            <svg class="mouse-svg" viewBox="0 0 180 280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="mouse-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- Mouse Body -->
                <path id="mouse-body" class="body" filter="url(#mouse-shadow)" d="
                    M 90 15
                    C 130 15, 155 45, 155 80
                    L 155 220
                    C 155 255, 130 275, 90 275
                    C 50 275, 25 255, 25 220
                    L 25 80
                    C 25 45, 50 15, 90 15
                    Z
                "/>

                <!-- Left Click (Attack) -->
                <path id="mouse-left" class="button mouse-btn" d="
                    M 38 20
                    C 50 16, 70 15, 85 15
                    L 85 105
                    L 38 105
                    L 38 45
                    C 38 30, 38 23, 38 20
                    Z
                "/>
                <text x="62" y="65" class="button-label">ATK</text>

                <!-- Right Click -->
                <path id="mouse-right" class="button mouse-btn" d="
                    M 142 20
                    C 130 16, 110 15, 95 15
                    L 95 105
                    L 142 105
                    L 142 45
                    C 142 30, 142 23, 142 20
                    Z
                "/>
                <text x="118" y="65" class="button-label">R</text>

                <!-- Scroll Wheel Area -->
                <rect id="scroll-bg" class="scroll-base" x="77" y="40" width="26" height="45" rx="8"/>

                <!-- Scroll Up Indicator (Reload) -->
                <path id="scroll-up" class="button scroll-btn" d="
                    M 90 43
                    L 99 54
                    L 81 54
                    Z
                "/>

                <!-- Scroll Click (Middle - Cycle Weapon) -->
                <ellipse id="mouse-middle" class="button scroll-click" cx="90" cy="63" rx="9" ry="7"/>
                <text x="90" y="66" class="button-label-tiny">SWAP</text>

                <!-- Scroll Down Indicator (Reload) -->
                <path id="scroll-down" class="button scroll-btn" d="
                    M 90 82
                    L 99 71
                    L 81 71
                    Z
                "/>

                <!-- Side Button 4 (Melee) -->
                <path id="mouse-4" class="button side-btn" d="
                    M 25 120
                    L 18 120
                    C 12 120, 10 126, 10 132
                    L 10 158
                    C 10 164, 12 170, 18 170
                    L 25 170
                    Z
                "/>
                <text x="2" y="150" class="button-label-small side-label">MELEE</text>

                <!-- Side Button 5 (Ultimate) -->
                <path id="mouse-5" class="button side-btn" d="
                    M 25 180
                    L 18 180
                    C 12 180, 10 186, 10 192
                    L 10 218
                    C 10 224, 12 230, 18 230
                    L 25 230
                    Z
                "/>
                <text x="2" y="210" class="button-label-small side-label">ULT</text>

                <!-- Sensor Indicator -->
                <ellipse id="sensor" class="sensor" cx="90" cy="252" rx="14" ry="7"/>
                <text x="90" y="268" class="button-label-small">AIM</text>
            </svg>
        </div>
    </div>

    <!-- Debug/Status Panel (can be hidden in OBS) -->
    <div id="status-panel" class="status-panel">
        <div id="gamepad-status">Gamepad: Not Connected</div>
        <div id="mouse-status">Mouse: Tracking</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
